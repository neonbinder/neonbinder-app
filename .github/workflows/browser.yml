name: Browser CI

# Build + unit tests, AND a per-PR Cloud Run preview for services/browser.
# This is the PRE-MERGE lane only. The post-merge prod deploy pipeline
# (build-push / deploy-dev / dev-promote / deploy-prod / prod-promote) lives in
# browser-deploy.yml and is invoked by release.yml — see the NEO-143 note below.
#
# WIF: the dev provider now trusts neonbinder/neonbinder-app (NEO-18 terraform
# change, neonbinder_ioc#25). GCP_WIF_PROVIDER_DEV / GCP_SERVICE_ACCOUNT_DEPLOYER_DEV
# are set on this repo.

on:
  # NEO-546: GitHub's merge queue fires merge_group; `paths:` cannot filter it,
  # so the `scope` job below does. Inert until MERGE_QUEUE is on and the ruleset
  # has a merge_queue rule.
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - "services/browser/**"
      # NEO-555: kept equal to the merge_group `scope` filter below. A change
      # to the fake-bsc files the browser tests read is covered by the PR
      # pipeline's browser-test job; it does not need a browser preview.
      # This workflow's own path (NEO-130). Without it a PR that changes only
      # this file does not run it, so the change ships unexercised — which is
      # exactly how a broken preview image path could reach main and take the
      # E2E pipeline down for every subsequent PR.
      - ".github/workflows/browser.yml"
      # The extracted deploy lane and the release driver, for the same reason:
      # a PR touching only those should still build + preview this service.
      - ".github/workflows/browser-deploy.yml"
      - ".github/workflows/release.yml"

# NEO-143: deliberately NO `push:` trigger. The prod deploy lane moved to
# browser-deploy.yml so release.yml can order it AHEAD of the web/Convex
# release. Re-adding a push trigger here would deploy in parallel with that
# release and re-create the mismatched-pair window that broke production on the
# NEO-141 merge. `workflow_dispatch` moved with the lane — that is where the
# dev-only validation path now lives.

concurrency:
  # Group per-PR and cancel in-flight so rapid pushes don't stack up redundant
  # preview builds. (Pre-merge only now, so the old main/dispatch arm of this
  # expression is gone.)
  group: browser-ci-pr-${{ github.event.pull_request.number || github.ref }}
  # A cancelled merge-queue run ejects the PR, so a merge group is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  # NEO-299: today's PR preview inherits whatever --max-instances the LAST
  # `gcloud run deploy` of the shared dev browser service happened to carry
  # (browser-deploy.yml's dev lane sets 20) — a tagged no-traffic preview
  # revision does not honour the service-level cap. Capped explicitly at the
  # dealer-preview scale agreed in NEO-299 (Jason, 2026-09-24: "Fast: ...
  # Browser preview: 3"), sized so a preview burst can't add to the 400 GiB
  # dev quota alongside the preprocess previews. Not part of
  # apps/web/convex/preprocessCapacity.json (that file is preprocess-only) —
  # capacity-parity in pr-pipeline.yml checks this literal directly.
  PREVIEW_BROWSER_MAX_INSTANCES: 3

defaults:
  run:
    working-directory: services/browser

jobs:
  # NEO-546: scope and mode. A pull_request run reaches this workflow through
  # `on.pull_request.paths`, but GitHub does not apply `paths:` to a merge_group
  # run, so the merge queue would otherwise build every service on every PR.
  # `changed` is therefore forced true on pull_request (today's behaviour) and
  # computed from the diff on merge_group. `full`, `pr` and `sha` come from the
  # shared ci-mode.sh: the preview is built on a merge group, or on a PR that is
  # not in cheap mode, and is keyed on the PR number either way.
  scope:
    name: Decide scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      changed: ${{ github.event_name == 'pull_request' && 'true' || steps.filter.outputs.browser }}
      full: ${{ steps.mode.outputs.full }}
      pr: ${{ steps.mode.outputs.pr }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide cheap or full
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/ci-mode.sh >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'merge_group'
        with:
          # Mirror `on.pull_request.paths` above.
          filters: |
            browser:
              - "services/browser/**"
              - ".github/workflows/browser.yml"
              - ".github/workflows/browser-deploy.yml"
              - ".github/workflows/release.yml"

  test:
    name: Build + unit tests
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/browser/.nvmrc
          cache: npm
          cache-dependency-path: services/browser/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ---------------------------------------------------------------------------
  # Per-PR preview: each PR gets a stable `pr-<N>` tagged, NO-TRAFFIC revision
  # on the dev Cloud Run service. Traffic-serving dev (main's HEAD) is
  # untouched. The deterministic tagged URL
  #   https://pr-<N>---neonbinder-browser-xxlo66yxuq-uc.a.run.app
  # is what apps/web's vercel-build.sh points the Convex preview's
  # NEONBINDER_BROWSER_URL at, so the web E2E exercises THIS PR's browser code.
  # Fork PRs are skipped (no WIF/OIDC access). Teardown: a cutover follow-up
  # (port preview-cleanup.yml on pull_request: closed).
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy per-PR Cloud Run preview
    needs: [scope, test]
    # NEO-546: built on a PR that is not in cheap mode (today's flow) and on
    # every merge group. A cheap PR run skips it; the queue builds it.
    if: |
      needs.scope.outputs.full == 'true'
      && needs.scope.outputs.changed == 'true'
      && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      preview_url: ${{ steps.capture.outputs.preview_url }}
      preview_tag: ${{ steps.capture.outputs.preview_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: ebay
        name: Preflight eBay config (sandbox, dev project)
        env:
          EBAY_CLIENT_ID: ${{ vars.EBAY_CLIENT_ID_SANDBOX }}
          EBAY_RU_NAME: ${{ vars.EBAY_RU_NAME_SANDBOX }}
          GCP_PROJECT: neonbinder-dev
        # NEO-415. Fail the deploy loudly rather than ship a revision whose eBay
        # routes answer 503 ebay_not_configured, or hand Cloud Run a secret
        # reference whose latest version is not enabled (an opaque deploy
        # failure). Resolves `latest` to its number and pins that number in the
        # deploy: Cloud Run reads secret env vars at instance start, so a
        # floating :latest would take a newly added version live on the next
        # cold start without a deploy. Needs the deployer's viewer grant on the
        # secret (neonbinder_ioc).
        run: |
          set -uo pipefail
          missing=()
          [ -n "$EBAY_CLIENT_ID" ] || missing+=("repo variable EBAY_CLIENT_ID_SANDBOX")
          [ -n "$EBAY_RU_NAME" ] || missing+=("repo variable EBAY_RU_NAME_SANDBOX")
          if ! out=$(gcloud secrets versions describe latest \
              --secret=ebay-client-secret --project="$GCP_PROJECT" \
              --format='value(state,name)' 2>&1); then
            missing+=("secret ebay-client-secret readable in $GCP_PROJECT (gcloud: $(printf '%s' "$out" | head -n1))")
          else
            state=$(printf '%s' "$out" | awk '{print $1}')
            version=$(printf '%s' "$out" | awk '{print $2}' | awk -F/ '{print $NF}')
            if [ "$state" != "ENABLED" ] || ! [[ "$version" =~ ^[0-9]+$ ]]; then
              missing+=("the latest version of secret ebay-client-secret in $GCP_PROJECT to be ENABLED (state: $state)")
            else
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::eBay config missing: $m"; done
            echo "::error::See NEO-415. Set the repo variables with gh variable set and add the secret version with gcloud secrets versions add ebay-client-secret."
            exit 1
          fi

      # NEO-552: a preview must talk to the FAKE BSC, never the real site. Fail
      # the deploy loudly if the fake's URL is not configured, and pin the
      # caller-key secret to a resolved version (see resolve-secret-version.sh).
      - id: fakebsc
        name: Preflight fake BSC config (dev project)
        env:
          FAKE_BSC_URL: ${{ vars.NEONBINDER_FAKE_BSC_URL }}
        run: |
          set -euo pipefail
          re='^https://neonbinder-fake-bsc-[a-z0-9-]+(\.[a-z0-9-]+)*\.run\.app$'
          if [[ -z "${FAKE_BSC_URL:-}" ]] || [[ ! "${FAKE_BSC_URL%/}" =~ $re ]] || [[ "${FAKE_BSC_URL%/}" == *---* ]]; then
            echo "::error::Repo variable NEONBINDER_FAKE_BSC_URL must be https://neonbinder-fake-bsc-….run.app, the fake's own service URL, with no tag or path (NEO-552)."
            exit 1
          fi
          version=$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-secret-version.sh" fake-bsc-caller-key neonbinder-dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        env:
          # A SEPARATE package from the deploy image `neonbinder-browser`
          # (NEO-130). Artifact Registry's `most_recent_versions` keep policy
          # ranks by PUSH recency, not by deploy — so while previews shared the
          # deploy package, every PR synchronize consumed a slot in the window
          # meant to protect deploys (measured here: 6 of 10 slots were
          # pr-*/untagged, the whole window spanning 9 days). Split out, rank
          # in `neonbinder-browser` is driven only by merges, so keep_count
          # genuinely means "N deploys deep".
          #
          # No new cleanup policy needed: `delete-stale-pr-images` (tag prefix
          # `pr-`, 30d) and `delete-old-untagged` (14d) apply to ALL packages.
          IMAGE: gcr.io/neonbinder-dev/neonbinder-browser-preview
          PR_NUMBER: ${{ needs.scope.outputs.pr }}
          HEAD_SHA: ${{ needs.scope.outputs.sha }}
        # cwd = services/browser (job default); Dockerfile.prod + context live here.
        #
        # NEO-484: --provenance=false --sbom=false pushes ONE image manifest,
        # not an OCI index + attestation (see .github/scripts/image-push-report.sh).
        run: |
          set -euo pipefail
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$HEAD_SHA" \
            -f Dockerfile.prod -t "$IMAGE:pr-$PR_NUMBER" .
          docker push "$IMAGE:pr-$PR_NUMBER"
          bash "$GITHUB_WORKSPACE/.github/scripts/image-push-report.sh" "$IMAGE:pr-$PR_NUMBER"

      - name: Deploy tagged no-traffic preview to dev Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-browser
          region: us-central1
          image: gcr.io/neonbinder-dev/neonbinder-browser-preview:pr-${{ needs.scope.outputs.pr }}
          project_id: neonbinder-dev
          env_vars: |
            ENVIRONMENT=dev
            EBAY_CLIENT_ID=${{ vars.EBAY_CLIENT_ID_SANDBOX }}
            EBAY_RU_NAME=${{ vars.EBAY_RU_NAME_SANDBOX }}
            EBAY_ENVIRONMENT=sandbox
            NEONBINDER_FAKE_BSC_URL=${{ vars.NEONBINDER_FAKE_BSC_URL }}
          secrets: |
            EBAY_CLIENT_SECRET=ebay-client-secret:${{ steps.ebay.outputs.version }}
            NEONBINDER_FAKE_BSC_KEY=fake-bsc-caller-key:${{ steps.fakebsc.outputs.version }}
          no_traffic: true
          tag: pr-${{ needs.scope.outputs.pr }}
          # NEO-299: explicit per-deploy cap — see the env block comment above.
          # Without this the preview inherited the shared dev service's last
          # deployed --max-instances (20), unbounded by anything this
          # workflow controls.
          flags: "--max-instances=${{ env.PREVIEW_BROWSER_MAX_INSTANCES }}"

      - id: capture
        name: Capture preview URL
        env:
          PR: ${{ needs.scope.outputs.pr }}
        run: |
          set -euo pipefail
          TAG="pr-$PR"
          TAGGED_URL=$(gcloud run services describe neonbinder-browser \
            --region=us-central1 \
            --project=neonbinder-dev \
            --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "ERROR: preview URL for tag=$TAG not found on service."
            exit 1
          fi
          echo "preview_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"
          echo "preview_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $TAGGED_URL"

  # Fake-BSC probe + real SportLots login round-trip against the tagged preview revision.
  # This is the dedicated browser-service e2e check (tests/integration/*.test.mjs
  # via test:prod-gate) that was missing in the monorepo CI — it catches auth
  # regressions in the PR's own browser code before the web E2E even runs.
  preview-login-probe:
    name: Preview login probe (fake BSC + SportLots)
    needs: deploy-preview
    # Runs whenever deploy-preview succeeded (implicit success()), on a PR or a
    # merge group.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/browser/.nvmrc
          cache: npm
          cache-dependency-path: services/browser/package-lock.json
      - run: npm ci

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Cloud Run validates the OIDC token's audience against the *base* service
      # URL even when the request targets the tag-prefixed host. Capture the base.
      - id: base-url
        name: Capture base service URL (token audience)
        run: |
          set -euo pipefail
          BASE_URL=$(gcloud run services describe neonbinder-browser \
            --region=us-central1 \
            --project=neonbinder-dev \
            --format='value(status.url)')
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      # Mint a Google OIDC ID token as the deployer SA (holds run.invoker via
      # Terraform deployer_invoker), audience = base service URL.
      - id: probe-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.base-url.outputs.base_url }}
          id_token_include_email: true

      # NEO-552: BSC is the fake. The probe signs in with the fake's constant
      # credentials and asserts /health says bscTarget=fake; no BSC credential
      # exists in CI. SportLots still logs in for real.
      - name: BSC probe against the preview (fake)
        env:
          TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          PROBE_ID_TOKEN: ${{ steps.probe-token.outputs.id_token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bsc-probe.sh" fake

      # NEO-555: fake-mode eBay probe preflight. The preview's browser service
      # talks to the fake eBay (same standing dev fake as BSC). To run the
      # probe's ACCOUNT leg too, CI mints a fake refresh token itself: POST
      # /__fake/ebay/consent, then the code grant with the fake's fixed public
      # client (ebay-fake-token.sh). If the mint fails, the probe runs the app
      # leg only and says so. Nothing here is a real eBay credential; the
      # fake never contacts eBay.
      #
      # WARNING ONLY for now: the fake's two recorded catalogue rows (shipping
      # services, item aspects) only exist after `ebay-record` has loaded them,
      # which happens after this PR merges. Until then the app leg answers 501
      # and a blocking gate would block the PR that adds it. Drop
      # continue-on-error (and the report step) once recordings are loaded
      # (NEO-555 PR B's cutover).
      - id: ebay-fake-keys
        name: Read the fake's caller key (eBay preflight)
        env:
          FAKE_URL: ${{ vars.NEONBINDER_FAKE_BSC_URL }}
        run: |
          set -uo pipefail
          if ! bash "$GITHUB_WORKSPACE/.github/scripts/fake-bsc-url.sh" >/dev/null; then
            echo "::warning::vars.NEONBINDER_FAKE_BSC_URL must be the fake's own https://neonbinder-fake-bsc-….run.app URL; skipping the eBay probe preflight"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! caller=$(gcloud secrets versions access latest --secret=fake-bsc-caller-key --project=neonbinder-dev); then
            echo "::warning::fake-bsc-caller-key unreadable; skipping the eBay probe preflight"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$caller"
          {
            echo "ready=true"
            echo "caller<<NB_EOF"
            echo "$caller"
            echo "NB_EOF"
          } >> "$GITHUB_OUTPUT"

      - id: ebay-fake-token
        if: steps.ebay-fake-keys.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}
          token_format: id_token
          id_token_audience: ${{ vars.NEONBINDER_FAKE_BSC_URL }}
          id_token_include_email: true

      - id: ebay-mint
        name: Mint a fake eBay refresh token (account leg)
        if: steps.ebay-fake-keys.outputs.ready == 'true'
        env:
          FAKE_URL: ${{ vars.NEONBINDER_FAKE_BSC_URL }}
          FAKE_ID_TOKEN: ${{ steps.ebay-fake-token.outputs.id_token }}
          FAKE_CALLER_KEY: ${{ steps.ebay-fake-keys.outputs.caller }}
          OUT_DIR: ${{ runner.temp }}/ebay-probe
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ebay-fake-token.sh"

      - id: ebay-probe
        name: eBay probe against the preview (fake, warning only)
        if: steps.ebay-fake-keys.outputs.ready == 'true'
        continue-on-error: true
        env:
          TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          PROBE_ID_TOKEN: ${{ steps.probe-token.outputs.id_token }}
          OUT_DIR: ${{ runner.temp }}/ebay-probe
          MINTED: ${{ steps.ebay-mint.outputs.minted }}
        run: |
          set -uo pipefail
          if [ "$MINTED" = "true" ]; then
            EBAY_FAKE_REFRESH_TOKEN=$(cat "$OUT_DIR/refresh-token")
            export EBAY_FAKE_REFRESH_TOKEN
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/ebay-probe.sh" fake
      - name: Report a failed fake-eBay probe as a warning
        if: steps.ebay-probe.outcome == 'failure'
        run: |
          echo "::warning::The preview fake-eBay probe failed (see the step above). Not blocking yet: the fake's eBay recordings load after this PR merges."
          {
            echo "### Preview fake-eBay probe failed (warning only)"
            echo "Check the probe step, then the fake's eBay recordings and health (services/fake-bsc/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SportLots login suite against preview
        env:
          TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          PROBE_ID_TOKEN: ${{ steps.probe-token.outputs.id_token }}
          SPORTLOTS_USERNAME: ${{ secrets.MAESTRO_SPORTLOTS_USERNAME }}
          SPORTLOTS_PASSWORD: ${{ secrets.MAESTRO_SPORTLOTS_PASSWORD }}
          # NEO-287: mirrors the Convex-side NEONBINDER_PAUSED_PLATFORMS switch.
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
        run: node --test tests/integration/sportlots-login.test.mjs

  # Sticky PR comment with the preview URL + probe result, always posted so a
  # failure still leaves a trace on the PR.
  comment-preview:
    name: Comment preview URL
    needs: [scope, deploy-preview, preview-login-probe]
    # NEO-546: a sticky PR comment only on a PR run that built a preview; the
    # merge group is not a PR conversation, and a cheap run built nothing.
    if: |
      always()
      && github.event_name == 'pull_request'
      && needs.scope.outputs.full == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # This job does not checkout (only gh-api calls), so override the workflow's
    # services/browser working-directory — that path doesn't exist here.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Sticky preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.deploy-preview.outputs.preview_url }}
          TAG: ${{ needs.deploy-preview.outputs.preview_tag }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          PROBE_RESULT: ${{ needs.preview-login-probe.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }
          URL_LINE="not deployed — see workflow run"
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$URL" ]; then URL_LINE="$URL"; fi
          cat > /tmp/body.md <<EOF
          <!-- neonbinder-browser-preview-marker -->
          ## Browser service preview

          **URL:** $URL_LINE
          **Tag:** \`$TAG\`

          **Checks**
          - Deploy: $(status "$DEPLOY_RESULT")
          - Login probe (fake BSC + SportLots): $(status "$PROBE_RESULT")

          The web E2E on this PR runs against this preview (NEONBINDER_BROWSER_URL is pointed at the tagged URL). [Workflow run]($RUN_URL)
          EOF
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("neonbinder-browser-preview-marker")) | .id' | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$(cat /tmp/body.md)" > /dev/null
            echo "Updated sticky comment $EXISTING."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$(cat /tmp/body.md)" > /dev/null
            echo "Created sticky comment."
          fi

