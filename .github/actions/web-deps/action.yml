name: "Web deps"
description: >-
  Node + apps/web dependencies (and optionally Playwright's Chromium) with the
  two expensive installs cached whole (NEO-628). apps/web/node_modules is
  restored under an exact key (OS, arch, runner image, Node version, lockfile
  hash; deliberately no restore-keys, so a stale tree is never reused) and, on
  a miss, built with `npm ci` and saved at once so later jobs of the same run
  hit. Chromium is restored by the installed @playwright/test version and
  `playwright install chromium` always runs (a no-op check on a hit).
  Use after actions/checkout. Needs no secrets and sets none.

inputs:
  browser:
    description: "'true' to also provide Playwright's Chromium; 'false' for lint, unit tests and the like."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve cache keys
      id: keys
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RUNNER_OS_: ${{ runner.os }}
        RUNNER_ARCH_: ${{ runner.arch }}
        LOCK_HASH: ${{ hashFiles('apps/web/package-lock.json') }}
      run: |
        set -euo pipefail
        node_version="$(tr -d '[:space:]' < apps/web/.nvmrc)"
        if [ -z "$LOCK_HASH" ]; then
          echo "::error::apps/web/package-lock.json is missing; nothing to key the dependency cache on."
          exit 1
        fi
        # ImageOS is exported by the runner (e.g. ubuntu24) and is not in the
        # expression contexts, so it is read here.
        echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"
        echo "nm_key=web-nm-v1-${RUNNER_OS_}-${RUNNER_ARCH_}-${ImageOS:-unknown}-node${node_version}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
        echo "pw_prefix=pw-chromium-v1-${RUNNER_OS_}-${RUNNER_ARCH_}-${ImageOS:-unknown}-pw" >> "$GITHUB_OUTPUT"

    - name: Restore apps/web/node_modules
      id: nm
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/web/node_modules
        key: ${{ steps.keys.outputs.nm_key }}

    # Two setup-node steps because the npm download cache is only worth
    # restoring when `npm ci` is going to run.
    - name: Set up Node (cache hit)
      if: steps.nm.outputs.cache-hit == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: apps/web/.nvmrc

    - name: Set up Node (cache miss, with npm cache)
      if: steps.nm.outputs.cache-hit != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: apps/web/.nvmrc
        cache: npm
        cache-dependency-path: apps/web/package-lock.json

    - name: Install apps/web dependencies (cache miss)
      if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/apps/web
      run: npm ci

    - name: Save apps/web/node_modules
      if: steps.nm.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/web/node_modules
        key: ${{ steps.keys.outputs.nm_key }}

    - name: Resolve the Playwright version
      id: pw
      if: inputs.browser == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/apps/web
      run: |
        set -euo pipefail
        version="$(node -p "require('@playwright/test/package.json').version")"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright Chromium
      id: browsers
      if: inputs.browser == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.pw_prefix }}${{ steps.pw.outputs.version }}

    # Always run: on a hit it only verifies the files; on a miss it downloads.
    - name: Install Playwright Chromium
      if: inputs.browser == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/apps/web
      run: npx playwright install chromium

    - name: Save Playwright Chromium
      if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.pw_prefix }}${{ steps.pw.outputs.version }}
